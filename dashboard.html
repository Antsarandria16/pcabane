<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Épicerie - Pro</title>
    
    <!-- Fichier CSS externe -->
    <link rel="stylesheet" href="style.css">
    
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // 1. Initialisation unique du client Supabase
        const SUPABASE_URL = 'https://qvbrezemqpuoreqfghfc.supabase.co'
        const SUPABASE_KEY = 'sb_publishable_XY3OjGaFASnBuXbWpnGtHw_ojFoUXyb'
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

        let currentUser = null;

        // 2. Vérification immédiate de la session
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession()
            
            if (!session) {
                window.location.href = 'login.html'
            } else {
                currentUser = session.user;
                document.addEventListener('DOMContentLoaded', () => {
                    const emailElement = document.getElementById('userEmail')
                    if (emailElement) {
                        emailElement.innerText = 'Connecté : ' + currentUser.email
                    }
                    // Charger les données dès que la page est prête
                    chargerProduits()
                })
            }
        }
        
        checkAuth()
    </script>
</head>
<body>

    <!-- Barre latérale de navigation -->
    <aside>
        <div class="logo">Épicerie Manager</div>
        <ul class="menu">
            <li class="active" onclick="switchTab('caisse', event)">Caisse / Vente</li>
            <li onclick="switchTab('stock', event)">Gestion des Stocks</li>
        </ul>
        <div style="padding: 20px 10px;">
            <p id="userEmail" style="font-size: 12px; color: #aaa; margin-bottom: 10px;"></p>
            <button id="logoutBtn" style="padding: 8px 12px; cursor: pointer; width: 100%;">Déconnexion</button>
        </div>
    </aside>

    <!-- Zone Principale -->
    <main>
        <header id="header-title">Module Caisse</header>

        <!-- ONGLET 1 : CAISSE -->
        <div id="caisse" class="content active">
            <div class="grid-2">
                <div>
                    <div class="card">
                        <h3>Ajouter un article au panier</h3>
                        <label for="product-select">Produit :</label>
                        <select id="product-select">
                            <option value="">Chargement des produits...</option>
                        </select>
                        
                        <label for="quantity">Quantité :</label>
                        <input type="number" id="quantity" value="1" min="1">
                        <button onclick="addToCart()">Ajouter au panier</button>
                    </div>
                </div>
                <div>
                    <div class="card">
                        <h3>Panier en cours</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Produit</th>
                                    <th>Qté</th>
                                    <th>Prix</th>
                                </tr>
                            </thead>
                            <tbody id="cart-list">
                                <!-- Articles affichés ici -->
                            </tbody>
                        </table>
                        <div class="total-box">Total : <span id="cart-total">0.00</span> Ar</div>
                        <button onclick="checkout()" style="width: 100%;">Valider et Encaisser</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ONGLET 2 : STOCK -->
        <div id="stock" class="content">
            <div class="grid-2">
                <div>
                    <div class="card">
                        <h3>Inventaire des Produits</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Nom</th>
                                    <th>Prix Unitaire</th>
                                    <th>Stock Restant</th>
                                </tr>
                            </thead>
                            <tbody id="stock-list">
                                <!-- Produits chargés depuis Supabase -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div>
                    <div class="card">
                        <h3>Ajouter un nouveau produit</h3>
                        <label for="new-name">Nom du produit</label>
                        <input type="text" id="new-name" placeholder="Ex: Fromage">
                        
                        <label for="new-price">Prix (Ar)</label>
                        <input type="number" id="new-price" step="0.01" placeholder="3000">
                        
                        <label for="new-stock">Quantité initiale</label>
                        <input type="number" id="new-stock" placeholder="15">
                        
                        <button onclick="addProduct()">Enregistrer dans Supabase</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script logique d'interaction et API Supabase -->
    <script>
        // Déconnexion propre
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut()
            window.location.href = 'login.html'
        })

        // Navigations Onglets
        function switchTab(tabId, evt) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu li').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            if (evt) evt.currentTarget.classList.add('active');

            document.getElementById('header-title').innerText = tabId === 'caisse' ? 'Module Caisse' : 'Module Gestion des Stocks';
        }

        // --- CHARGEMENT DYNAMIQUE DEPUIS SUPABASE ---
        async function chargerProduits() {
            const { data: produits, error } = await supabase.from('produits').select('*').order('nom', { ascending: true })

            if (error) {
                console.error("Erreur de chargement des produits :", error)
                return
            }

            const select = document.getElementById('product-select')
            const stockList = document.getElementById('stock-list')

            select.innerHTML = ''
            stockList.innerHTML = ''

            if (produits.length === 0) {
                select.innerHTML = '<option value="">Aucun produit disponible</option>'
                stockList.innerHTML = '<tr><td colspan="3">Aucun produit en stock</td></tr>'
                return
            }

            produits.forEach(p => {
                // Remplir le menu déroulant Caisse
                const opt = document.createElement('option')
                opt.value = p.id
                opt.setAttribute('data-price', p.prix)
                opt.setAttribute('data-name', p.nom)
                opt.text = `${p.nom} (${p.prix} Ar)`
                select.add(opt)

                // Remplir le tableau Stock
                stockList.innerHTML += `
                    <tr>
                        <td>${p.nom}</td>
                        <td>${p.prix} Ar</td>
                        <td>${p.stock}</td>
                    </tr>
                `
            })
        }

        // --- LOGIQUE PANIER ET CAISSE ---
        let cart = [];
        let total = 0;

        function addToCart() {
            const select = document.getElementById('product-select');
            if (!select.value) return;

            const selectedOpt = select.options[select.selectedIndex];
            const id = selectedOpt.value;
            const name = selectedOpt.getAttribute('data-name');
            const unitPrice = parseFloat(selectedOpt.getAttribute('data-price'));
            const qty = parseInt(document.getElementById('quantity').value);

            if (isNaN(qty) || qty <= 0) {
                alert("Veuillez saisir une quantité valide.");
                return;
            }

            const itemTotal = unitPrice * qty;
            cart.push({ id, name, qty, unitPrice, price: itemTotal });
            
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById('cart-list');
            cartList.innerHTML = '';
            total = 0;

            cart.forEach(item => {
                total += item.price;
                cartList.innerHTML += `<tr><td>${item.name}</td><td>${item.qty}</td><td>${item.price.toFixed(2)} Ar</td></tr>`;
            });

            document.getElementById('cart-total').innerText = total.toFixed(2);
        }

        async function checkout() {
            if (cart.length === 0) {
                alert("Le panier est vide !");
                return;
            }

            // 1. Enregistrer la vente dans Supabase
            const { data: vente, error: venteError } = await supabase
                .from('ventes')
                .insert([{ total: total, user_id: currentUser.id }])
                .select()
                .single()

            if (venteError) {
                alert("Erreur lors de la validation de la vente : " + venteError.message)
                return
            }

            // 2. Enregistrer les détails de la vente
            const lignes = cart.map(item => ({
                vente_id: vente.id,
                produit_id: item.id,
                quantite: item.qty,
                prix_unitaire: item.unitPrice,
                total_ligne: item.price
            }))

            const { error: lignesError } = await supabase.from('ligne_ventes').insert(lignes)

            if (lignesError) {
                alert("Erreur lors de l'enregistrement des lignes : " + lignesError.message)
                return
            }

            alert(`Vente de ${total.toFixed(2)} Ar validée avec succès !`);
            cart = [];
            updateCartUI();
            chargerProduits(); // Recharger les produits
        }

        // --- LOGIQUE AJOUT PRODUIT EN BASE DE DONNÉES ---
        async function addProduct() {
            const name = document.getElementById('new-name').value;
            const price = parseFloat(document.getElementById('new-price').value);
            const stock = parseInt(document.getElementById('new-stock').value);

            if (!name || isNaN(price) || isNaN(stock)) {
                alert("Veuillez remplir tous les champs correctement.");
                return;
            }

            const { error } = await supabase
                .from('produits')
                .insert([{ nom: name, prix: price, stock: stock }])

            if (error) {
                alert("Erreur lors de l'ajout dans Supabase : " + error.message)
            } else {
                alert("Produit ajouté avec succès dans Supabase !");
                document.getElementById('new-name').value = '';
                document.getElementById('new-price').value = '';
                document.getElementById('new-stock').value = '';
                
                chargerProduits(); // Mettre à jour l'affichage
            }
        }
    </script>
</body>
</html>
