<script>
  const SUPABASE_URL = 'https://qvbrezemqpuoreqfghfc.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_XY3OjGaFASnBuXbWpnGtHw_ojFoUXyb'
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    
    const email = document.getElementById('email').value
    const password = document.getElementById('password').value
    const message = document.getElementById('message')

    message.style.color = 'blue'
    message.innerText = 'Connexion en cours...'

    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      })

      if (error) {
        message.style.color = 'red'
        // Afficher l'erreur exacte renvoyée par Supabase
        message.innerText = 'Erreur : ' + (error.message === 'Invalid login credentials' 
          ? 'Identifiants incorrects (Email ou mot de passe faux)' 
          : error.message)
      } else if (data.user) {
        message.style.color = 'green'
        message.innerText = 'Connexion réussie ! Redirection...'
        
        // Petite pause pour s'assurer de l'enregistrement de la session avant de rediriger
        setTimeout(() => {
          window.location.href = 'dashboard.html'
        }, 500)
      }
    } catch (err) {
      message.style.color = 'red'
      message.innerText = 'Erreur réseau ou clé Supabase invalide.'
      console.error(err)
    }
  })
</script>
