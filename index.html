<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Épicerie</title>
  
  <!-- Chargement du SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
    .champ { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 15px; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

  <div class="box">
    <h2 style="text-align: center; margin-bottom: 20px;">Connexion</h2>
    
    <div class="champ">
      <label>Email</label>
      <input type="email" id="email" placeholder="votre.email@exemple.com">
    </div>

    <div class="champ">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button type="button" onclick="lancerConnexion()">Se connecter</button>

    <div id="status"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qvbrezemqpuoreqfghfc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XY3OjGaFASnBuXbWpnGtHw_ojFoUXyb';
    
    let supabase = null;

    // Initialisation
    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } else {
        alert("Attention : Le script Supabase ne s'est pas chargé dans le navigateur.");
      }
    } catch(err) {
      alert("Erreur initialisation : " + err.message);
    }

    async function lancerConnexion() {
      const statusDiv = document.getElementById('status');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "Veuillez remplir l'email et le mot de passe.";
        return;
      }

      if (!supabase) {
        alert("Supabase n'est pas prêt. Vérifiez votre connexion internet.");
        return;
      }

      statusDiv.style.color = "blue";
      statusDiv.innerText = "Envoi à Supabase...";

      try {
        const res = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (res.error) {
          statusDiv.style.color = "red";
          statusDiv.innerText = "Erreur : " + res.error.message;
          alert("Erreur de connexion : " + res.error.message);
        } else if (res.data.user) {
          statusDiv.style.color = "green";
          statusDiv.innerText = "Succès ! Redirection...";
          window.location.href = 'dashboard.html';
        }
      } catch (e) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "Erreur bloquante : " + e.message;
        alert("Erreur : " + e.message);
      }
    }
  </script>
</body>
</html>
