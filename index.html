<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Épicerie</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 350px;
    }
    h2 { margin-bottom: 20px; text-align: center; color: #333; }
    .field { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 14px; font-weight: bold; color: #555; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: #218838; }
    #message { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; word-break: break-word; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Connexion Épicerie</h2>
    
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="votre.email@exemple.com">
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button type="button" id="btnConnecter">Se connecter</button>
    
    <p id="message"></p>
  </div>

  <!-- Chargement du SDK Supabase UMD -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    const SUPABASE_URL = 'https://qvbrezemqpuoreqfghfc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XY3OjGaFASnBuXbWpnGtHw_ojFoUXyb';

    // Initialisation globale
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Vérification de la session active
    async function verifierSession() {
      try {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session) {
          window.location.href = '../../dashboard.html';
        }
      } catch (e) {
        console.error('Erreur session:', e);
      }
    }
    verifierSession();

    // Gestion du clic de connexion
    document.getElementById('btnConnecter').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const message = document.getElementById('message');

      if (!email || !password) {
        message.style.color = 'red';
        message.innerText = 'Veuillez remplir l\'email et le mot de passe.';
        return;
      }

      message.style.color = 'blue';
      message.innerText = 'Envoi de la requête...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          message.style.color = 'red';
          message.innerText = 'Erreur : ' + error.message;
        } else if (data.user) {
          message.style.color = 'green';
          message.innerText = 'Connexion réussie ! Redirection...';
          setTimeout(() => {
            // Redirection vers dashboard.html selon l'emplacement de votre fichier index.html
            window.location.href = '../../dashboard.html';
          }, 500);
        }
      } catch (err) {
        message.style.color = 'red';
        message.innerText = 'Erreur technique : ' + err.message;
      }
    });
  </script>
</body>
</html>
