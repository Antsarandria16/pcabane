<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <!-- Chargement du SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

  <form id="loginForm" style="display: flex; flex-direction: column; gap: 10px; width: 300px;">
    <h2>Connexion</h2>
    
    <label>Email :</label>
    <input type="email" id="email" required style="padding: 8px;">

    <label>Mot de passe :</label>
    <input type="password" id="password" required style="padding: 8px;">

    <button type="submit" style="padding: 10px; cursor: pointer;">Se connecter</button>
    <p id="message" style="color: red;"></p>
  </form>

  <script>
    // 1. Remplacez par vos clés Supabase
    const SUPABASE_URL = 'https://votre-projet.supabase.co'
    const SUPABASE_KEY = 'votre-cle-anon-public'
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    // 2. Gestion de la connexion
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const message = document.getElementById('message')

      message.style.color = 'black'
      message.innerText = 'Connexion en cours...'

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      })

      if (error) {
        message.style.color = 'red'
        message.innerText = 'Erreur : ' + error.message
      } else {
        // Redirection vers index.html après réussite
        window.location.href = 'index.html'
      }
    })
  </script>
</body>
</html>
